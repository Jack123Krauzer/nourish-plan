<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176448"><title>Nourish Plan | Nutrition Pages</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17352a;background:#f4f8f4}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e0ebe3;padding:20px max(24px,calc((100vw - 1050px)/2))}.logo{font-size:19px;font-weight:800;letter-spacing:-.5px;color:#176448}main{max-width:1050px;margin:66px auto;padding:0 24px}h1{font-size:clamp(32px,5vw,56px);letter-spacing:-2px;margin:12px 0}p{color:#667e72;line-height:1.6}.eyebrow{color:#176448;font-size:12px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px;margin-top:36px}.card{background:#fff;border:1px solid #dce7df;border-radius:20px;padding:24px;display:block;color:inherit;text-decoration:none;box-shadow:0 6px 24px #1b47370a;transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-3px);border-color:#7bb69a}.icon{display:grid;place-items:center;background:#e8f3ec;color:#176448;width:48px;height:48px;border-radius:14px;font-size:24px}.card h2{margin:23px 0 7px;font-size:21px}.card p{margin:0 0 24px;font-size:14px}.go{color:#176448;font-weight:800;font-size:14px}footer{margin:70px 0 20px;color:#7f9789;font-size:13px}#status{font-size:13px}
</style></head><body><header><div class="logo">✳ Nourish Plan</div></header><main><span class="eyebrow">Nutrition library</span><h1>Choose a diet plan.</h1><p>All available HTML pages in this directory, organized in one place.</p><div class="grid" id="pages"><a class="card" href="./sajid-maulana.html"><div class="icon">🥗</div><h2>Sajid Maulana</h2><p>Seven-day muscle gain plan with meal-wise portions, nutrients and optional recipes.</p><span class="go">Open diet plan →</span></a></div><footer><span id="status">Showing available plans</span> · Nourish Plan</footer></main>
<script>
/* GitHub Pages does not expose directory listings. Read the public repository API where possible;
   keep the built-in page card available offline and if API calls are blocked. */
(async()=>{try{const response=await fetch("https://api.github.com/repos/Jack123Krauzer/nourish-plan/contents/",{headers:{Accept:"application/vnd.github+json"}});if(!response.ok)return;const entries=await response.json();if(!Array.isArray(entries))return;const files=entries.filter(f=>f.type==="file"&&/\.html?$/i.test(f.name)&&f.name.toLowerCase()!=="index.html");if(!files.length)return;const known={"sajid-maulana.html":["Sajid Maulana","Seven-day muscle gain plan with portions, nutrients and recipes."]};const grid=document.getElementById("pages");grid.textContent="";files.forEach(file=>{const a=document.createElement("a");a.className="card";a.href="./"+encodeURIComponent(file.name);const h=document.createElement("div");h.className="icon";h.textContent="🥗";const title=document.createElement("h2");title.textContent=(known[file.name]||[])[0]||file.name.replace(/\.html?$/i,"").replace(/[-_]/g," ");const desc=document.createElement("p");desc.textContent=(known[file.name]||[])[1]||"Open this HTML page.";const go=document.createElement("span");go.className="go";go.textContent="Open page →";a.append(h,title,desc,go);grid.append(a)});document.getElementById("status").textContent=files.length+" page"+(files.length===1?"":"s")+" available";}catch(e){/* local file/offline fallback */}})();
</script></body></html>
