name: Diet plan QA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test meal data and dashboard logic
        run: node --test tests/diet-plan.test.mjs
      - name: Install Chromium browser tests
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Test desktop tablet mobile layouts
        run: node tests/browser.test.mjs
